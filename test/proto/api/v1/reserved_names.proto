syntax = "proto3";

package test.api.v1;

option go_package = "github.com/cjermain/protoc-gen-pydantic/test/api";

message BuiltinNames {
  bool  bool  = 1;
  float float = 2;
  bytes bytes = 3;
  int32 int   = 4;
}

message ReservedFieldNames {
  string model_config = 1;
  string model_fields = 2;
  string model_dump = 3;
}

// ReservedOneof exercises a oneof group where some member names are Python
// reserved words. The validator must use the aliased Python names (bool_,
// float_) in getattr() calls, not the original proto names.
message ReservedOneof {
  oneof value {
    bool  bool  = 1;
    float float = 2;
    int32 count = 3;
  }
}

syntax = "proto3";

package test.api.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/cjermain/protoc-gen-pydantic/test/api";

// ValidatedScalars exercises numeric bound constraints.
message ValidatedScalars {
  // Age must be between 0 and 150 exclusive of 0.
  int32 age = 1 [(buf.validate.field).int32.gt = 0, (buf.validate.field).int32.lte = 150];
  // Score must be in [0.0, 100.0].
  double score = 2 [(buf.validate.field).double.gte = 0.0, (buf.validate.field).double.lte = 100.0];
  // Priority must be positive.
  int64 priority = 3 [(buf.validate.field).int64.gt = 0];
  // Ratio must be non-negative and less than 1.
  float ratio = 4 [(buf.validate.field).float.gte = 0.0, (buf.validate.field).float.lt = 1.0];
  // Rank must be in [1, 10].
  uint32 rank = 5 [(buf.validate.field).uint32.gte = 1, (buf.validate.field).uint32.lte = 10];
  // Count must be non-zero (covers uint64 / fixed64 literal formatting).
  optional uint64 count = 6 [(buf.validate.field).uint64.gt = 0];
  // Offset must be non-negative (covers sint32 / sfixed32 literal formatting).
  optional sint32 offset = 7 [(buf.validate.field).sint32.gte = 0];
}

// ValidatedStrings exercises string length and pattern constraints.
message ValidatedStrings {
  // Name must be between 1 and 100 characters.
  string name = 1 [(buf.validate.field).string.min_len = 1, (buf.validate.field).string.max_len = 100];
  // Code must match uppercase letters only.
  string code = 2 [(buf.validate.field).string.pattern = "^[A-Z]+$"];
  // Bio has only a max length.
  string bio = 3 [(buf.validate.field).string.max_len = 500];
  // Tag has only a min length.
  string tag = 4 [(buf.validate.field).string.min_len = 2];
}

// ValidatedRepeated exercises repeated field length constraints.
message ValidatedRepeated {
  // Items must have between 1 and 10 elements.
  repeated string items = 1 [(buf.validate.field).repeated.min_items = 1, (buf.validate.field).repeated.max_items = 10];
  // Tags must have at least 1 element.
  repeated string tags = 2 [(buf.validate.field).repeated.min_items = 1];
}

// ValidatedMap exercises map field length constraints.
message ValidatedMap {
  // Labels must have between 1 and 10 entries.
  map<string, string> labels = 1 [
    (buf.validate.field).map.min_pairs = 1,
    (buf.validate.field).map.max_pairs = 10
  ];
}

// ValidatedReserved exercises a field whose name is a Python reserved word and
// also carries a buf.validate constraint. The generated field must emit both
// alias= and the constraint kwargs in a single _Field() call.
message ValidatedReserved {
  // Score must be positive.
  float float = 1 [(buf.validate.field).float.gt = 0.0];
}

// ValidatedOneof exercises a oneof field that also carries a constraint.
message ValidatedOneof {
  oneof value {
    // Must be positive when set.
    int32 small = 1 [(buf.validate.field).int32.gt = 0];
    // Must be positive when set.
    int64 large = 2 [(buf.validate.field).int64.gt = 0];
  }
}

// ValidatedDuration exercises Duration bound constraints, which use
// message-typed rule fields and cannot be translated to Pydantic Field() args.
// The generator must not panic; instead it emits dropped-constraint comments.
message ValidatedDuration {
  // Timeout must be positive and at most one hour.
  google.protobuf.Duration timeout = 1 [
    (buf.validate.field).duration.gt = {seconds: 0},
    (buf.validate.field).duration.lte = {seconds: 3600}
  ];
}

// ValidatedTimestamp exercises Timestamp bound constraints, which also use
// message-typed rule fields and must not panic.
message ValidatedTimestamp {
  // CreatedAt must be after the Unix epoch.
  google.protobuf.Timestamp created_at = 1 [
    (buf.validate.field).timestamp.gt = {seconds: 0}
  ];
}

// ValidatedStringLen exercises the string.len exact-length constraint.
message ValidatedStringLen {
  // Code must be exactly 5 characters.
  string code = 1 [(buf.validate.field).string.len = 5];
}

// ValidatedStringAffix exercises string.prefix and string.suffix constraints.
message ValidatedStringAffix {
  // Url must start with "https://".
  string url = 1 [(buf.validate.field).string.prefix = "https://"];
  // Filename must end with ".go".
  string filename = 2 [(buf.validate.field).string.suffix = ".go"];
  // Path must start with "/home/" and end with ".txt".
  string path = 3 [
    (buf.validate.field).string.prefix = "/home/",
    (buf.validate.field).string.suffix = ".txt"
  ];
  // Content must match a pattern; prefix is also set (conflict → prefix dropped).
  string content = 4 [
    (buf.validate.field).string.pattern = "^[a-z]+$",
    (buf.validate.field).string.prefix = "abc"
  ];
  // Report must match a pattern; suffix is also set (conflict → suffix dropped).
  string report = 5 [
    (buf.validate.field).string.pattern = "^report_",
    (buf.validate.field).string.suffix = ".csv"
  ];
  // Notes must match a pattern; contains is also set (conflict → contains dropped).
  string notes = 6 [
    (buf.validate.field).string.pattern = "^[a-z]+$",
    (buf.validate.field).string.contains = "note"
  ];
}

// ValidatedExamples exercises the field examples annotation.
message ValidatedExamples {
  // Count with integer examples.
  int32 count = 1 [
    (buf.validate.field).int32.gt = 0,
    (buf.validate.field).int32.example = 1,
    (buf.validate.field).int32.example = 42
  ];
  // Name with string examples.
  string name = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.example = "alice",
    (buf.validate.field).string.example = "bob"
  ];
}

// ValidatedFormats exercises format and semantic validators: email, URI,
// IP address (v4/v6), UUID, and float finite.
message ValidatedFormats {
  // Email must be a valid email address.
  string email = 1 [(buf.validate.field).string.email = true];
  // Website must be a valid URI.
  string website = 2 [(buf.validate.field).string.uri = true];
  // Address must be a valid IP address.
  string address = 3 [(buf.validate.field).string.ip = true];
  // Ratio must be finite (not inf or NaN).
  float ratio = 4 [(buf.validate.field).float.finite = true];
  // Token must be a valid UUID.
  string token = 5 [(buf.validate.field).string.uuid = true];
  // Host must be a valid IPv4 address.
  string host_v4 = 6 [(buf.validate.field).string.ipv4 = true];
  // Host must be a valid IPv6 address.
  string host_v6 = 7 [(buf.validate.field).string.ipv6 = true];
}

// ValidatedFinite exercises float.finite and double.finite constraints.
message ValidatedFinite {
  // Ratio must be finite (not inf or NaN).
  float ratio = 1 [(buf.validate.field).float.finite = true];
  // Value must be finite (not inf or NaN).
  double value = 2 [(buf.validate.field).double.finite = true];
}

// ValidatedDropped exercises constraints that are recognised but not translated.
message ValidatedDropped {
  // Name is required; the required constraint is not translated.
  string name = 1 [(buf.validate.field).required = true];
  // Blob has a bytes.const constraint which is not translated (bytes kind unsupported).
  bytes blob = 2 [(buf.validate.field).bytes.const = "\x01"];
  // Score must be positive; required is also set but not translated.
  int32 score = 3 [(buf.validate.field).required = true, (buf.validate.field).int32.gt = 0];
}

// ValidatedConst exercises the const constraint translated to Literal[...].
message ValidatedConst {
  string tag = 1 [(buf.validate.field).string.const = "fixed"];
  int32 count = 2 [(buf.validate.field).int32.const = 42];
  bool active = 3 [(buf.validate.field).bool.const = true];
  double score = 4 [(buf.validate.field).double.const = 3.14];
  uint32 code = 5 [(buf.validate.field).uint32.const = 100];
  bool inactive = 6 [(buf.validate.field).bool.const = false];
}

// ValidatedIn exercises in and not_in constraints translated to AfterValidator.
message ValidatedIn {
  string status = 1 [(buf.validate.field) = {string: {in: ["active", "inactive"]}}];
  string code = 2 [(buf.validate.field) = {string: {not_in: ["deleted", "archived"]}}];
  int32 priority = 3 [(buf.validate.field) = {int32: {in: [1, 2, 3]}}];
  // Limit covers uint32.in (exercises the uint path in formatScalarLiteral).
  uint32 limit = 4 [(buf.validate.field) = {uint32: {in: [10, 50, 100]}}];
}

// ValidatedEnumIn exercises enum.in and enum.not_in translated to AfterValidator,
// including on repeated.items and map.values elements — those go through a
// separate nested-constraint extraction path from the plain scalar field case.
// enum.in/not_in values are proto numbers (int32), but use_enum_values reduces
// the field to its enum member's name (or number, with use_integers_for_enums)
// by the time the AfterValidator runs — the generator must translate the
// numeric literals to match.
message ValidatedEnumIn {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_ACTIVE = 1;
    STATUS_ARCHIVED = 2;
  }
  Status status = 1 [(buf.validate.field).enum = { in: [0, 1] }];
  Status excluded = 2 [(buf.validate.field).enum = { not_in: [2] }];
  repeated Status statuses = 3 [(buf.validate.field).repeated.items.enum = { in: [0, 1] }];
  map<string, Status> status_by_key = 4 [(buf.validate.field).map.values.enum = { in: [0, 1] }];
}

// ValidatedUnique exercises repeated.unique translated to AfterValidator.
message ValidatedUnique {
  repeated string tags = 1 [(buf.validate.field).repeated.unique = true];
  repeated int32 scores = 2 [(buf.validate.field).repeated.unique = true];
}

// ValidatedBytes exercises bytes length constraints.
message ValidatedBytes {
  // Token must be at least 16 bytes.
  bytes token = 1 [(buf.validate.field).bytes.min_len = 16];
  // Hash must be exactly 32 bytes.
  bytes hash = 2 [(buf.validate.field).bytes.len = 32];
  // Payload must be at most 1024 bytes.
  bytes payload = 3 [(buf.validate.field).bytes.max_len = 1024];
  // Uuid must be a valid 16-byte binary UUID.
  bytes uuid = 4 [(buf.validate.field).bytes.uuid = true];
}

// ValidatedStringContains exercises the string.contains constraint.
message ValidatedStringContains {
  // Topic must contain "protobuf".
  string topic = 1 [(buf.validate.field).string.contains = "protobuf"];
  // Label must start with "env-" and contain "prod".
  // The contains conflicts with prefix so contains is dropped.
  string label = 2 [
    (buf.validate.field).string.prefix = "env-",
    (buf.validate.field).string.contains = "prod"
  ];
}

// A user account.
message ValidatedUser {
  // Display name (1–50 characters).
  string name = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 50
  ];

  // Age in years.
  int32 age = 2 [(buf.validate.field).int32.gte = 0];

  // Contact email address.
  string email = 3 [(buf.validate.field).string.email = true];

  enum Role {
    ROLE_UNSPECIFIED = 0;
    ROLE_VIEWER      = 1;
    ROLE_EDITOR      = 2;
    ROLE_ADMIN       = 3;
  }

  Role role = 4 [(buf.validate.field).enum.example = 1];
}

// ValidatedRequired exercises required = true on proto3 optional scalar fields
// (where it strips | None) vs. message-typed and plain scalar fields (dropped).
message ValidatedRequired {
  // required on proto3 optional scalar: | None stripped, field becomes required.
  optional string required_name = 1 [(buf.validate.field).required = true];
  // required on proto3 optional scalar with an additional constraint.
  optional int32 required_score = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32.gt = 0
  ];
  // required on message-typed optional: not translated, emits dropped comment.
  optional Detail required_detail = 3 [(buf.validate.field).required = true];
  // required on plain proto3 scalar: not translated, emits dropped comment.
  string plain_name = 4 [(buf.validate.field).required = true];

  // Detail is a nested message used to test message-typed required handling.
  message Detail {
    string value = 1;
  }
}

// ValidatedOneofFormat exercises an AfterValidator-type constraint (email) on a
// oneof field. In default mode the generated type is
// _Annotated[str, _AfterValidator(_validate_email)] | None, exercising the
// `| None` branch of wrapWithAnnotated. In gen_options mode it becomes
// _Optional[_Annotated[str, _AfterValidator(_validate_email)]], exercising the
// _Optional[...] branch.
message ValidatedOneofFormat {
  oneof contact {
    // Must be a valid email address when set.
    string email_contact = 1 [(buf.validate.field).string.email = true];
    string phone_contact = 2;
  }
}

// ValidatedConstOptional exercises const constraints on a oneof field, covering
// the `| None` and `_Optional[...]` branches of ConstLiteral handling in
// applyConstraintTypeOverrides (lines 1291-1294 in main.go).
message ValidatedConstOptional {
  oneof token_type {
    // Only "fixed" is valid when set.
    string fixed_token = 1 [(buf.validate.field).string.const = "fixed"];
    string other_token = 2;
  }
}

// ValidatedFormatsExtended exercises additional format validators beyond the
// original six (email, uri, ip, ipv4, ipv6, uuid).
message ValidatedFormatsExtended {
  // Hostname must be a valid DNS hostname.
  string hostname = 1 [(buf.validate.field).string.hostname = true];
  // UriRef must be a valid URI reference (absolute or relative).
  string uri_ref = 2 [(buf.validate.field).string.uri_ref = true];
  // Addr must be a valid IP address or hostname.
  string addr = 3 [(buf.validate.field).string.address = true];
  // Tuuid must be a trimmed UUID (32 hex chars, no dashes).
  string tuuid = 4 [(buf.validate.field).string.tuuid = true];
  // Ulid must be a valid ULID.
  string ulid = 5 [(buf.validate.field).string.ulid = true];
  // Cidr must be a valid IP address with prefix length (host address).
  string cidr = 6 [(buf.validate.field).string.ip_with_prefixlen = true];
  // CidrV4 must be a valid IPv4 address with prefix length.
  string cidr_v4 = 7 [(buf.validate.field).string.ipv4_with_prefixlen = true];
  // CidrV6 must be a valid IPv6 address with prefix length.
  string cidr_v6 = 8 [(buf.validate.field).string.ipv6_with_prefixlen = true];
  // IpNet must be a valid IP network (host bits must be zero).
  string ip_net = 9 [(buf.validate.field).string.ip_prefix = true];
  // Ipv4Net must be a valid IPv4 network (host bits must be zero).
  string ipv4_net = 10 [(buf.validate.field).string.ipv4_prefix = true];
  // Ipv6Net must be a valid IPv6 network (host bits must be zero).
  string ipv6_net = 11 [(buf.validate.field).string.ipv6_prefix = true];
  // Endpoint must be a valid host:port pair.
  string endpoint = 12 [(buf.validate.field).string.host_and_port = true];
}

// ValidatedWellKnownRegex exercises the well_known_regex enum validator.
message ValidatedWellKnownRegex {
  // HeaderName must be a valid HTTP header name.
  string header_name = 1 [(buf.validate.field).string.well_known_regex = KNOWN_REGEX_HTTP_HEADER_NAME];
  // HeaderValue must be a valid HTTP header value.
  string header_value = 2 [(buf.validate.field).string.well_known_regex = KNOWN_REGEX_HTTP_HEADER_VALUE];
  // LooseHeader uses well_known_regex with strict=false (strict is not translated).
  string loose_header = 3 [(buf.validate.field).string = {
    well_known_regex: KNOWN_REGEX_HTTP_HEADER_NAME,
    strict: false
  }];
}

// ValidatedNotContains exercises the string.not_contains constraint.
message ValidatedNotContains {
  // Username must not contain "admin".
  string username = 1 [(buf.validate.field).string.not_contains = "admin"];
}

// ValidatedFloatIn exercises float.in and double.not_in constraints.
message ValidatedFloatIn {
  // Ratio must be one of the allowed values.
  float ratio = 1 [(buf.validate.field) = {float: {in: [0.25, 0.5, 0.75, 1.0]}}];
  // Score must not be a negative sentinel value.
  double score = 2 [(buf.validate.field) = {double: {not_in: [-1.0, -2.0]}}];
}

// ValidatedFloatExamples exercises float/double/bool/uint32 example annotations.
message ValidatedFloatExamples {
  // Ratio must be positive with float examples.
  float ratio = 1 [(buf.validate.field).float = {gt: 0.0, example: 1.5, example: 0.25}];
  // Score must be positive with double examples.
  double score = 2 [(buf.validate.field).double = {gt: 0.0, example: 3.14, example: 2.71}];
  // Flag with bool examples.
  bool flag = 3 [(buf.validate.field).bool.example = false, (buf.validate.field).bool.example = true];
  // Code must be positive with uint32 examples.
  uint32 code = 4 [(buf.validate.field).uint32 = {gt: 0, example: 7, example: 42}];
}

// ValidatedCEL exercises basic field-level CEL transpilation.
message ValidatedCEL {
  // Age must be positive.
  int32 age = 1 [(buf.validate.field).cel = {
    id: "positive",
    expression: "this > 0",
    message: "age must be positive"
  }];
}


// ValidatedCELField exercises field-level CEL transpilation.
message ValidatedCELField {
  // Must be positive.
  int32 age = 1 [(buf.validate.field).cel = {
    id: "positive",
    expression: "this > 0",
    message: "age must be positive"
  }];
  // Must start with an uppercase letter.
  string name = 2 [(buf.validate.field).cel = {
    id: "uppercase_start",
    expression: "this.matches(\"^[A-Z]\")",
    message: "name must start with uppercase"
  }];
  // Combined: both bool-returning and chained.
  string code = 3 [
    (buf.validate.field).cel = {
      id: "code_prefix",
      expression: "this.startsWith(\"X\")",
      message: "code must start with X"
    },
    (buf.validate.field).cel = {
      id: "code_len",
      expression: "this.size() > 2",
      message: "code must be longer than 2 chars"
    }
  ];
}

// ValidatedCELMessage exercises message-level cross-field CEL.
message ValidatedCELMessage {
  repeated string bar = 1;
  repeated string baz = 2;

  option (buf.validate.message).cel = {
    id: "globally_unique",
    expression: "(this.bar + this.baz).unique()",
    message: "all values in bar and baz must be globally unique"
  };
}

// ValidatedCELHas exercises the has() presence macro.
message ValidatedCELHas {
  optional string first_name = 1;
  optional string last_name = 2;

  option (buf.validate.message).cel = {
    id: "name_required",
    expression: "has(this.first_name) || has(this.last_name)",
    message: "at least one name field must be set"
  };
}

// ValidatedCELCrossField exercises a cross-field numeric comparison.
message ValidatedCELCrossField {
  int32 min_val = 1;
  int32 max_val = 2;

  option (buf.validate.message).cel = {
    id: "min_less_than_max",
    expression: "this.min_val < this.max_val",
    message: "min_val must be less than max_val"
  };
}

// ValidatedCELReservedName exercises message-level CEL referencing fields
// whose names are Python builtins/keywords (renamed with trailing underscore).
message ValidatedCELReservedName {
  optional bool bool = 1;
  optional float float = 2;

  option (buf.validate.message).cel = {
    id: "reserved_check",
    expression: "!has(this.bool) || this.bool == true",
    message: "bool field must be true when set"
  };
  option (buf.validate.message).cel = {
    id: "float_check",
    expression: "!has(this.float) || this.float > 0.0",
    message: "float field must be positive when set"
  };
}

// ValidatedCELDropped exercises the drop path for unsupported CEL
// (comprehension). The dropped comment must appear in the generated file.
message ValidatedCELDropped {
  repeated int32 scores = 1 [(buf.validate.field).cel = {
    id: "all_positive",
    expression: "this.all(x, x > 0)",
    message: "all scores must be positive"
  }];
}

// ValidatedCELStringReturn exercises a string-returning CEL expression
// (the expression itself is the error message).
message ValidatedCELStringReturn {
  int32 value = 1 [(buf.validate.field).cel = {
    id: "positive_msg",
    expression: "this > 0 ? '' : 'value must be positive'"
  }];
}

// ValidatedBytesIP exercises bytes.ip/ipv4/ipv6 binary address validation.
message ValidatedBytesIP {
  // Binary IP address (4 bytes for IPv4 or 16 bytes for IPv6).
  bytes ip_addr = 1 [(buf.validate.field).bytes.ip = true];
  // Binary IPv4 address (exactly 4 bytes).
  bytes ipv4_addr = 2 [(buf.validate.field).bytes.ipv4 = true];
  // Binary IPv6 address (exactly 16 bytes).
  bytes ipv6_addr = 3 [(buf.validate.field).bytes.ipv6 = true];
}

// ValidatedRepeatedItems exercises repeated.items per-element constraints.
message ValidatedRepeatedItems {
  // Each tag must be 1–32 characters.
  repeated string tags = 1 [(buf.validate.field).repeated.items = {
    string: { min_len: 1, max_len: 32 }
  }];
  // Each score must be positive.
  repeated int32 scores = 2 [(buf.validate.field).repeated.items = {
    int32: { gt: 0 }
  }];
  // Each email must be a valid email address.
  repeated string emails = 3 [(buf.validate.field).repeated.items = {
    string: { email: true }
  }];
}

// ValidatedMapConstraints exercises map.keys and map.values per-entry constraints.
message ValidatedMapConstraints {
  // Keys must be 1–63 chars; values must be non-empty.
  map<string, string> labels = 1 [
    (buf.validate.field).map.keys   = { string: { min_len: 1, max_len: 63 } },
    (buf.validate.field).map.values = { string: { min_len: 1 } }
  ];
  // Values must be positive.
  map<string, int32> counters = 2 [
    (buf.validate.field).map.values = { int32: { gt: 0 } }
  ];
  // Keys must be a valid email; values must match a pattern.
  map<string, string> rules = 3 [
    (buf.validate.field).map.keys   = { string: { email: true } },
    (buf.validate.field).map.values = { string: { pattern: "^[a-z]+$" } }
  ];
  // Must have at least 1 entry; keys must be non-empty (tests min_pairs + keys together).
  map<string, string> tagged = 4 [
    (buf.validate.field).map.min_pairs = 1,
    (buf.validate.field).map.keys      = { string: { min_len: 1 } }
  ];
  // Integer keys must be positive (exercises non-string key constraints).
  map<int32, string> scores = 5 [
    (buf.validate.field).map.keys   = { int32: { gt: 0 } },
    (buf.validate.field).map.values = { string: { not_in: [""] } }
  ];
}

// ValidatedIgnore exercises ignore = IGNORE_IF_ZERO_VALUE, which opts a field
// out of ConstrainedRequired even when its constraints reject the zero value.
message ValidatedIgnore {
  // Email allows empty string via ignore (not ConstrainedRequired).
  string email = 1 [
    (buf.validate.field).string.email = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // Age allows zero via ignore (not ConstrainedRequired).
  int32 age = 2 [
    (buf.validate.field).int32.gt = 0,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

// ValidatedStringBytes exercises string.min_bytes/max_bytes/len_bytes constraints.
message ValidatedStringBytes {
  // Payload must be at least 1 UTF-8 byte (ConstrainedRequired: min_bytes > 0).
  string payload = 1 [(buf.validate.field).string.min_bytes = 1];
  // Token must be exactly 32 UTF-8 bytes (ConstrainedRequired).
  string token = 2 [(buf.validate.field).string.len_bytes = 32];
  // Label has only a max_bytes limit (NOT ConstrainedRequired: "" is 0 bytes ≤ 255).
  string label = 3 [(buf.validate.field).string.max_bytes = 255];
  // Tag exercises min_bytes + max_bytes together (ConstrainedRequired: min_bytes > 0).
  string tag = 4 [
    (buf.validate.field).string.min_bytes = 2,
    (buf.validate.field).string.max_bytes = 64
  ];
}

// ValidatedCELIsEmail exercises isEmail() in a CEL expression.
message ValidatedCELIsEmail {
  string contact = 1 [(buf.validate.field).cel = {
    id: "valid_email",
    expression: "this.isEmail()",
    message: "contact must be a valid email"
  }];
}

// ValidatedCELIsIp exercises isIp() with optional version argument.
message ValidatedCELIsIp {
  string addr = 1 [(buf.validate.field).cel = {
    id: "valid_ip",
    expression: "this.isIp()",
    message: "must be a valid IP address"
  }];
  string addr_v4 = 2 [(buf.validate.field).cel = {
    id: "valid_ipv4",
    expression: "this.isIp(4)",
    message: "must be a valid IPv4 address"
  }];
  string addr_v6 = 3 [(buf.validate.field).cel = {
    id: "valid_ipv6",
    expression: "this.isIp(6)",
    message: "must be a valid IPv6 address"
  }];
}

// ValidatedCELIsIpPrefix exercises isIpPrefix().
message ValidatedCELIsIpPrefix {
  string prefix = 1 [(buf.validate.field).cel = {
    id: "valid_prefix",
    expression: "this.isIpPrefix()",
    message: "must be a valid IP prefix (CIDR)"
  }];
  string prefix_v4 = 2 [(buf.validate.field).cel = {
    id: "valid_prefix_v4",
    expression: "this.isIpPrefix(4, false)",
    message: "must be a valid IPv4 prefix"

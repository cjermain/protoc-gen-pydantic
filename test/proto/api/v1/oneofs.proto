syntax = "proto3";

package test.api.v1;

option go_package = "github.com/cjermain/protoc-gen-pydantic/test/api";

message Oneofs {
  oneof union {
    int32 a = 1;
    string b = 2;
  }
}

// SingleOneof has a oneof with exactly one field, exercising the single-element
// tuple form ("field_name",) in the generated @model_validator.
message SingleOneof {
  oneof choice {
    int32 the_value = 1;
  }
}
